name: Refresh avatars

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/people.py
      - run: |
          if ! git diff --quiet -- people.json || [ -n "$(git status --porcelain people.json)" ]; then
            git config user.name "valkyrien-bot"
            git config user.email "valkyrien-bot@users.noreply.github.com"
            git add people.json avatars
            git commit -m "Refresh avatars"
            git push
          fi
